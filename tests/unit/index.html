<!doctype html>
<meta charset="utf-8">
<title>PrivacyBrew unit tests</title>
<script src="../../extension/lib/psl.js"></script>
<script src="../../extension/lib/disconnect.js"></script>
<script src="../../extension/lib/report.js"></script>
<script>
(async () => {
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (error) { results.push({ name, ok: false, error: String(error && error.message || error) }); }
  }
  function eq(actual, expected, message) {
    if (actual !== expected) throw new Error(`${message}: expected ${expected}, got ${actual}`);
  }
  function ok(value, message) { if (!value) throw new Error(message); }

  const [pslData, disconnectData, rulesMeta, adRules, contentRules] = await Promise.all([
    fetch('/extension/data/psl.json').then(r => r.json()),
    fetch('/extension/data/disconnect.json').then(r => r.json()),
    fetch('/extension/rules/metadata.json').then(r => r.json()),
    fetch('/extension/rules/block_advertising.json').then(r => r.json()),
    fetch('/extension/rules/allow_same_company.json').then(r => r.json())
  ]);
  const psl = PB.PSL.initPsl(pslData);
  const disconnect = PB.Disconnect.initDisconnect(disconnectData, psl);

  test('PSL handles co.uk', () => eq(psl.registrableDomain('news.bbc.co.uk'), 'bbc.co.uk', 'co.uk registrable domain'));
  test('PSL handles private github.io', () => eq(psl.registrableDomain('team.github.io'), 'team.github.io', 'github.io registrable domain'));
  test('PSL handles ck wildcard', () => eq(psl.registrableDomain('a.b.ck'), 'a.b.ck', 'ck wildcard domain'));
  test('PSL handles ck exception', () => eq(psl.registrableDomain('www.ck'), 'www.ck', 'ck exception domain'));
  test('PSL keeps IP address', () => eq(psl.registrableDomain('127.0.0.1'), '127.0.0.1', 'IP address'));
  test('PSL keeps localhost', () => eq(psl.registrableDomain('localhost'), 'localhost', 'localhost'));
  test('Disconnect matches subdomains', () => ok(disconnect.find('www.google-analytics.com'), 'google analytics match'));
  test('Disconnect maps company', () => eq(disconnect.find('static.doubleclick.net').company, 'Google', 'doubleclick company'));
  test('Disconnect gives bat.bing.com advertising priority', () => eq(disconnect.find('bat.bing.com').category, 'Advertising', 'bat bing category'));
  test('Disconnect gives facebook.net social priority', () => eq(disconnect.find('facebook.net').category, 'Social', 'facebook category'));
  test('Disconnect treats owned property as first party', () => ok(disconnect.sameCompanyAsSite(disconnect.find('doubleclick.net'), 'google.com'), 'Google property is same company'));
  test('Disconnect does not treat other site as first party', () => ok(!disconnect.sameCompanyAsSite(disconnect.find('doubleclick.net'), 'example.com'), 'example is not Google'));
  test('Overall label low', () => eq(PB.Report.overallLabel(2, false), 'Little tracking found', 'low label'));
  test('Overall label middle', () => eq(PB.Report.overallLabel(3, false), 'Some tracking', 'middle label'));
  test('Overall label high', () => eq(PB.Report.overallLabel(6, false), 'A lot of tracking', 'high label'));
  test('Fingerprint bumps label', () => eq(PB.Report.overallLabel(1, true), 'Some tracking', 'fingerprint bump'));
  test('Plural helper keeps singular', () => eq(PB.Report.plural(1, 'company', 'companies'), 'company', 'singular plural'));
  test('Plural helper uses plural', () => eq(PB.Report.plural(2, 'company', 'companies'), 'companies', 'plural helper'));
  test('DNR rule counts are under the static limit', () => ok(rulesMeta.totalStaticRules < 30000, 'static DNR limit'));
  test('DNR has advertising rules', () => ok(rulesMeta.counts.Advertising > 0, 'advertising rule count'));
  test('DNR has no Content ruleset', () => ok(!rulesMeta.counts.Content, 'no content rules'));
  test('DNR rule IDs are unique', () => {
    const ids = new Set(adRules.map(rule => rule.id));
    eq(ids.size, adRules.length, 'unique advertising IDs');
  });
  test('DNR rules have property exclusions', () => ok(adRules.some(rule => (rule.condition.excludedInitiatorDomains || []).includes('youtube.com')), 'property exclusion'));
  test('DNR has same company allow rules', () => ok(contentRules.some(rule => (rule.condition.initiatorDomains || []).includes('youtube.com')), 'same company allow rule'));

  test('Report summarizes distinct trackers', () => {
    const s = PB.Report.emptyState(1, 'https://example.com', 'example.com');
    PB.Report.addTracker(s, disconnect.find('google-analytics.com'), 'google-analytics.com', 'allowed');
    PB.Report.addTracker(s, disconnect.find('doubleclick.net'), 'doubleclick.net', 'blocked');
    const summary = PB.Report.summarize(s);
    eq(summary.trackerCount, 1, 'same company count');
    eq(summary.blockedCompanyCount, 1, 'blocked company count');
  });
  test('Report keeps multiple company categories', () => {
    const s = PB.Report.emptyState(1, 'https://example.com', 'example.com');
    PB.Report.addTracker(s, disconnect.find('google-analytics.com'), 'google-analytics.com', 'allowed');
    PB.Report.addTracker(s, disconnect.find('doubleclick.net'), 'doubleclick.net', 'blocked');
    const tracker = PB.Report.summarize(s).trackers[0];
    ok(tracker.categories.includes('Advertising'), 'advertising category');
    ok(tracker.categories.includes('Analytics'), 'analytics category');
    eq(tracker.category, 'Advertising', 'highest priority category');
  });

  window.__TEST_DONE__ = { pass: results.filter(r => r.ok).length, fail: results.filter(r => !r.ok).length, results };
})();
</script>
<body>Unit tests</body>
